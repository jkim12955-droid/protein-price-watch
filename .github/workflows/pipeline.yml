name: 단백질 가격 비교기

on:
  schedule:
    # 하루 세 번 확인한다. 참가격 서버가 GitHub 러너의 IP 대역 일부를 조용히 막아서,
    # 한 번만 시도하면 세 번에 한 번꼴로 헛돈다. 실측한 내용은 docs/build-log.md 에 있다.
    - cron: "30 0 * * *"    # 매일 09:30 KST
    - cron: "30 4 * * *"    # 매일 13:30 KST
    - cron: "30 10 * * *"   # 매일 19:30 KST
    - cron: "0 0 * * 1"     # 월요일 09:00 KST. 주간 리포트
  workflow_dispatch:
    inputs:
      dates:
        description: "특정 조사일자를 강제로 받으려면 YYYYMMDD 를 공백으로 구분해 입력"
        required: false

permissions:
  contents: write           # 수집한 원본과 리포트를 저장소에 다시 커밋한다

concurrency:
  group: pricewatch
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
      NUTRIENT_API_KEY: ${{ secrets.NUTRIENT_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 설치 단계가 없다. 표준 라이브러리만 쓴다.

      - name: 수집 (새 조사일이 있을 때만 받는다)
        id: collect
        env:
          # 입력값을 run 안에 직접 넣으면 임의 명령이 실행될 수 있다.
          # 환경변수로 건네 셸이 해석하지 못하게 한다.
          DATES: ${{ inputs.dates }}
        run: |
          if [ -n "$DATES" ]; then
            python pw.py collect --date $DATES --force
          else
            python pw.py collect
          fi

      - name: 적재 (원본 전체를 멱등하게 다시 넣는다)
        run: python pw.py load

      - name: 매칭 (상품에 영양 항목을 잇는다. 캐시가 있어 새 상품만 조회한다)
        run: python pw.py match

      - name: 자동 점검 (임계값을 넘으면 여기서 실패한다)
        run: python pw.py qa

      - name: 주간 리포트 (월요일에만 만든다. 수동 실행이면 바로 만든다)
        id: report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python pw.py report --force --any-day
          else
            python pw.py report
          fi

      # 매 실행마다 커밋하면 실행 시각 한 줄만 바뀐 커밋이 하루 세 개씩 쌓인다.
      # 격주로 오는 진짜 기록이 그 잡음에 묻히므로, 의미 있는 일이 있었을 때만 남긴다.
      # 새 조사분을 받았을 때, 리포트를 만들었을 때, 무엇이든 실패했을 때.
      - name: 결과 커밋 (새 조사분, 리포트, 실패가 있을 때만)
        if: >-
          always() && (
            steps.collect.outputs.collected != '0' ||
            steps.report.outputs.report_path != '' ||
            failure()
          )
        run: |
          git config user.name  "pricewatch-bot"
          git config user.email "pricewatch-bot@users.noreply.github.com"
          git add data/raw data/state.json data/nutrient_search_cache.json \
                  data/qa_latest.json data/report_latest.json reports docs
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "자동 실행: $(date +'%Y-%m-%d %H:%M KST')"
            # 사이에 다른 커밋이 들어왔으면 한 번 당겨서 다시 민다
            git push || (git pull --rebase && git push)
          fi

      # 월요일 09:00 실행에서만 보내게 하면, GitHub 이 그 예약을 건너뛰었을 때
      # 뒤이은 09:30 실행이 리포트를 만들고도 슬랙은 보내지 않는다. 예약 실행은 늦거나 빠질 수 있다.
      # 그래서 실행 시각이 아니라 "새 리포트가 나왔는가" 로 정한다. 같은 조사분 리포트는 한 번만 만들어지므로 중복도 없다.
      - name: 슬랙 알림 (새 리포트가 나왔거나 실패했을 때)
        if: always() && (steps.report.outputs.report_path != '' || failure())
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_PATH: ${{ steps.report.outputs.report_path }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            python pw.py notify --report "$REPORT_PATH"
          else
            python pw.py notify --text "단백질 가격 비교기 실행 실패 ($JOB_STATUS). 실행 기록: $RUN_URL"
          fi
