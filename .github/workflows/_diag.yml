name: 연결 진단 (임시)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 러너 IP
        run: |
          echo -n "runner_ip="
          curl -sS -m 10 https://api.ipify.org || true
          echo
      - name: 같은 IP 에서 curl 과 python 을 번갈아
        run: |
          ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['PRICE_API_KEY'],safe=''))")
          U="https://apis.data.go.kr/B551919/ProductPriceInfoService/getProductPriceInfoSvc?serviceKey=$ENC&numOfRows=1&pageNo=1&goodInspectDay=20260828&goodId=1000"
          curl -sS -o /dev/null -m 20 -w "curl1  code=%{http_code} %{time_total}s\n" "$U" || echo "curl1  실패"
          python3 tools/_probe.py "py1  "
          curl -sS -o /dev/null -m 20 -w "curl2  code=%{http_code} %{time_total}s\n" "$U" || echo "curl2  실패"
          python3 tools/_probe.py "py2  "
